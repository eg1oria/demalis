# Всё на одном сервере: база, API, сайт и https. Пошагово — frontend/docs/SETUP.md.
# Запуск и обновление (из корня репозитория): ./deploy/deploy.sh
# Настройки — backend/.env (шаблон backend/.env.example)
# и frontend/.env (шаблон frontend/.env.production.example).
name: demalis-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    # Отсюда берётся POSTGRES_PASSWORD (тот же, что в DATABASE_URL).
    env_file: backend/.env
    environment:
      POSTGRES_USER: demalis
      POSTGRES_DB: demalis
    # Порт наружу не публикуется: база видна только бэкенду.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demalis -d demalis"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  backend:
    build: backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      # Запросы приходят через Caddy — IP посетителя из X-Forwarded-For.
      TRUST_PROXY: "1"
      UPLOADS_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    # Только для проверок с самого сервера: curl http://127.0.0.1:4000/health
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging

  frontend:
    build:
      context: frontend
      # При сборке Next берёт данные у бэкенда: он уже запущен (deploy/deploy.sh)
      # и слушает 127.0.0.1:4000 — тот же адрес http://backend:4000, что и при работе.
      network: host
      extra_hosts:
        - "backend:127.0.0.1"
      secrets:
        - frontend_env
    restart: unless-stopped
    env_file: frontend/.env
    environment:
      API_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    # Кэш страниц (ISR) и уменьшенных фото переживает перезапуск.
    volumes:
      - next-cache:/app/.next/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/robots.txt').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    # Отсюда SITE_DOMAIN и API_DOMAIN.
    env_file: backend/.env
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  # Копии базы и фото каждый день в 03:00 (Алматы) — deploy/backup/README.md.
  backup:
    build: deploy/backup
    restart: unless-stopped
    # Отсюда POSTGRES_PASSWORD и Telegram для сообщений об ошибках.
    env_file: backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/uploads:ro
      # Папка на сервере, а не volume: docker compose down -v её не сотрёт.
      - ./backups:/backups
    logging: *logging

secrets:
  frontend_env:
    file: frontend/.env

volumes:
  postgres-data:
  uploads:
  next-cache:
  caddy-data:
  caddy-config:
